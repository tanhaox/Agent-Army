<!DOCTYPE html>
<html>
<head><title>Test SSE</title></head>
<body>
<h1>深度分析 SSE 测试</h1>
<div id="status"></div>
<div id="results"></div>
<script>
const symbols = ['600905.SH', '002212.SZ'];

async function test() {
  const status = document.getElementById('status');
  const results = document.getElementById('results');
  
  status.textContent = '开始请求...';
  
  try {
    const response = await fetch('/api/llm/auto-analyze', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ symbols }),
    });

    status.textContent = `状态: ${response.status}, 类型: ${response.type}`;
    results.textContent = '收到数据, 正在处理...\n';

    if (!response.ok) {
      status.textContent = `错误: HTTP ${response.status}`;
      return;
    }

    if (!response.body) {
      status.textContent = '错误: response.body 为 null';
      return;
    }

    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    let completed = 0;

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop() || '';

      for (const line of lines) {
        if (line.startsWith('data: ')) {
          try {
            const event = JSON.parse(line.slice(6));
            if (event.type === 'progress') {
              completed = event.completed;
              results.textContent += `progress: ${event.completed}/${event.total} - ${event.result?.symbol}\n`;
            } else if (event.type === 'done') {
              results.textContent += `\n=== 完成 ===\n`;
              results.textContent += `成功: ${(event.individual || []).filter(d => d.status === 'success').length}\n`;
              results.textContent += `batch_scores: ${Object.keys(event.batch_scores || {}).length} 只\n`;
              status.textContent = '完成!';
            }
          } catch (e) {
            results.textContent += `解析错误: ${e.message}\n`;
          }
        }
      }
    }
    results.textContent += '\n流结束';
  } catch (e) {
    status.textContent = `错误: ${e.message}`;
    results.textContent = e.stack;
  }
}

test();
</script>
</body>
</html>
