[tool:pytest]
# pytest 配置文件

# 测试目录
testpaths = projects Agent_Army/tests

# 测试文件模式
python_files = test_*.py *_test.py
python_classes = Test* *
python_functions = test_*

# 命令行选项
addopts =
    -v
    --strict-markers
    --tb=short
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-report=xml:coverage.xml
    --disable-warnings

# 标记定义
markers =
    unit: 单元测试
    integration: 集成测试
    performance: 性能测试
    slow: 慢速测试
    fast: 快速测试

# 覆盖率配置
[coverage:run]
source = .
omit =
    */tests/*
    */test_*.py
    */__pycache__/*
    */site-packages/*
    */dist/*
    github_downloads/*

# 覆盖率报告配置
[coverage:report]
# 最低覆盖率要求
precision = 2
show_missing = True
skip_covered = False

# 忽略的行类型
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod

# 按模块显示覆盖率
[coverage:html]
directory = htmlcov

# 覆盖率 XML 报告
[coverage:xml]
output = coverage.xml
