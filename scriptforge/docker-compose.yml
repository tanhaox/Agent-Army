services:
  # ── 数据库 ──────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: scriptforge
      POSTGRES_USER: scriptforge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scriptforge123}
    ports:
      - "${POSTGRES_PORT:-15433}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./backend/backups:/backups
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scriptforge -d scriptforge"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── 缓存 / 消息队列 ─────────────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6382}:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── 向量数据库 ──────────────────────────────────────────
  chromadb:
    image: chromadb/chroma:latest
    ports:
      - "${CHROMA_PORT:-8002}:8000"
    volumes:
      - chroma_data:/chroma/chroma
    restart: unless-stopped
    environment:
      ANONYMIZED_TELEMETRY: "FALSE"
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/8000'"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── 后端 API ────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "${BACKEND_PORT:-8080}:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://scriptforge:${POSTGRES_PASSWORD:-scriptforge123}@postgres:5432/scriptforge
      REDIS_URL: redis://redis:6379/0
      CHROMA_HOST: chromadb
      CHROMA_PORT: 8000
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com/v1}
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      DEBUG: ${DEBUG:-false}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      chromadb:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads
      - ./backend/logs:/app/logs
      - models:/app/models
      - ./backend/.env:/app/.env:ro
      - voice_profiles:/app/voice_profiles
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/docs"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── 前端 ────────────────────────────────────────────────
  frontend:
    image: nginx:alpine
    ports:
      - "${FRONTEND_PORT:-3001}:80"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./deployment/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pg_data:
  redis_data:
  chroma_data:
  uploads:
  models:
  voice_profiles:
