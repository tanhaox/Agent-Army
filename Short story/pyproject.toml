[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-coauthor"
version = "0.1.0"
description = "Short story AI coauthor — multi-stage writing collaboration CLI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "requests>=2.31",
    "flask>=3.0",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.scripts]
ai-coauthor = "ai_coauthor.cli:main"

[tool.setuptools]
packages = ["ai_coauthor"]

[tool.setuptools.package-data]
ai_coauthor = ["prompts/**/*.md", "prompts/**/*.yaml", "guards/dictionaries/*.yaml"]
