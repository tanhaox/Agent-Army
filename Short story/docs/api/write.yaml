# write.yaml — write 命令 API

## 命令 ID

`write`

## 命令描述

**核心写章节命令**——这是 MVP 最核心的命令之一（之前漏列！）。

按 `state-detector.md`：进入 write 状态 → 防胡写实时 + 声纹核查 + 机械表达检测 + 违规词警告 + fact 自动抽取。

## 入参

```yaml
book_name:
  type: str
  required: true
chapter_n:
  type: int
  required: true
action:
  type: enum
  enum: [enter, append, save, exit]
  default: enter
  description: 进入 / 追加内容 / 保存 / 退出
content:
  type: str
  required: false
  description: 追加内容（action=append 时必填）
```

## 出参

```yaml
state:
  type: enum
  enum: [writing, reviewing]
issues:
  type: array
  description: 当前段落的守护结果
  items:
    severity: enum [🔴, 🟡, 🟢]
    type: enum [world_rule_violation, forbidden_word, mechanical_expression, ai_smell, voice_forbidden, mechanical_forbidden]
    location: str
    text_excerpt: str
    suggestion: str
save_result:
  type: object
  description: action=save 时返回
  fields:
    saved_path: str
    facts_extracted: int
    foresights_detected: array of str
```

## 退出码

| code | 含义 |
|------|------|
| 0 | 写入 / 保存成功 |
| 1 | 保存成功但有 🟡 警告 |
| 2 | 🔴 红警拦截（作者必须处理 / 手动忽略） |
| 3 | 配置错误 |

## 路由

- task_type: `consistency_check_realtime`（防胡写子调用）
- state: **writing**（强制）
- **强制本地 Ollama**（writing 屏蔽云端）

## 子调用

- 段落保存后：`facts_extraction`（off-queue）
- 章节保存后：`voice_check` + `consistency_recheck`

## 关联

- 子系统：`state-detector.md`（状态入口）/ `quality_guards_granularity.md`（4 门禁）/ `facts-extraction.md`（保存抽取）/ `voice_print.md`（声纹守护）/ `foreshadow_half_loop.md`（伏笔事件）
- 决策：P1（红警强制拦截）/ F6（内容出处豁免）
- Web spec：`write.html`

## 测试用例

1. **进入写入**：action=enter → state=writing
2. **段落追加**：action=append + content="..." → issues（命中 🔴 时退出 2）
3. **保存章节**：action=save → 写文件 + 抽 facts + 触发声纹复检
4. **退出**：action=exit → state 转 reviewing
