# cumulative_audit.yaml — cumulative_audit 命令 API

## 命令 ID

`cumulative_audit`

## 命令描述

**6+ 泳池跨章巡检**——按 `gantt_audit.md` 设计，**读 facts.yaml 不读原文**。

按 P11 锁定：每 10 章一次甘特图巡检；6 个 MVP 泳池并行处理。

## 入参

```yaml
book_name:
  type: str
  required: true
chapter_range:
  type: array
  items: int
  description: [start, end] 章节号范围；默认最近 10 章
mode:
  type: enum
  enum: [auto, full, gated]
  default: auto
  description: auto=按 chapter_range 默认；full=全量；gated=仅触发 🔴
swimlanes:
  type: array
  items: enum [foreshadow, character_arc, item_progression, world_rule, hook_density, relationship]
  description: 选择特定泳池（默认 6 个全跑）
```

## 出参

```yaml
audit_summary:
  chapter_range: array of int
  swimlane_count: int
  overall_status: enum [✅, ⚠️, ❌]
issues:
  type: array
  swimlane: enum [foreshadow, character_arc, item_progression, world_rule, hook_density, relationship]
  severity: enum [✅_pass, ⚠️_warn, ❌_must_fix, 🔴_overdue]
  issue: str
  location: str  # 章节号或事件 ID
  suggestion: str
overall_score: int  # 0-100
gantt_mermaid: str  # Mermaid 文本
missing_chapters:
  type: array
  items: int
  description: facts 缺失章节（Ollama 失败时）
```

## 退出码

| code | 含义 |
|------|------|
| 0 | 全部泳池通过 |
| 1 | 有 ⚠️ 警告 |
| 2 | 有 ❌ 必须修复 / 🔴 过期 |
| 3 | 缺 facts.yaml |
| 4 | 章节范围过大（>30 章）需 cloud |

## 路由

- task_type: `gantt_audit_local_per_swimlane` + `gantt_audit_cloud_summary`
- state: **reviewing**
- **6+ 泳池本地并行**（每泳池 4k token），汇总走云端

## 触发

- 自动：每 10 章保存时
- git diff：🟡 中度变更也会触发
- 手动：作者主动触发

## 关联

- 子系统：`gantt_audit.md` / `facts-extraction.md`（读 facts.yaml）
- 决策：P11 / F7（事实抽取）/ F11（基于事实）
- Web spec：`audit.html`

## 测试用例

1. **章节 1-10 完成**：6 泳池全部 read facts
2. **过期伏笔**：foreshadow chapter_due=5 但 chapter=15 → 🔴 overdue
3. **OOC 检测**：人物弧光 chapter=20 突然性格反转
4. **Mermaid 输出**：6 泳池可视化
5. **缺 facts**：chapter=8 的 facts.yaml 缺失 → 报告 + 退出 3
