# kickoff_meeting.yaml — kickoff_meeting 命令 API

## 命令 ID

`kickoff_meeting`

## 命令描述

**立项会 = 启动器**。Step 1 完成后强制触发。多 Agent 云端协同审查设定 + 派生声纹。

按 `kickoff_meeting.md` 设计：4-6 Agent persona 并发 → 独立报告 + 问题汇总 → 通过则声纹派生。

## 入参

```yaml
book_name:
  type: str
  required: true
mode:
  type: enum
  enum: [increment, full]
  default: increment
  description: 增量模式（仅看自上次 kickoff 后的变更） vs 全量模式
since:
  type: str
  required: false
  description: 增量模式的起点（章节号 / commit hash / ISO 时间）
force:
  type: bool
  default: false
  description: 强制全量，忽略 mode
```

## 出参

```yaml
decision:
  type: enum
  enum: [passed, must_fix, hard_block]
issues:
  type: array
  items:
    severity: enum [🔴_hard_block, 🟠_must_fix, 🟡_should_improve, 🟢_approved]
    category: str  # 7 类冲突之一
    title: str
    location: str
    description: str
    suggestion: str
    flagged_by: array of str  # 哪些 agent 标出
voiceprints_generated:
  type: array
  items: str  # 派生的角色声纹文件
overall_score:
  type: int
  description: 0-100 综合得分（立项会通过度）
```

**示例**：

```json
{
  "decision": "must_fix",
  "issues": [
    {
      "severity": "🟠_must_fix",
      "category": "金手指 vs 世界观边界",
      "title": "隐身能力违反'本界无隐身'",
      "location": "02-characters.md §主角金手指",
      "description": "金手指允许隐身但世界观规定无隐身术",
      "suggestion": "删除隐身或调整规则",
      "flagged_by": ["档案 Agent", "世界观 Agent"]
    }
  ],
  "voiceprints_generated": ["voice_prints/protagonist.md", "voice_prints/rival1.md"]
}
```

## 退出码

| code | 含义 | 后续 |
|------|------|------|
| 0 | passed | 进入 Step 2 |
| 1 | must_fix（可打磨通过） | 作者修改后重跑 |
| 2 | hard_block | 必须回 Step 1 重设 |
| 3 | 配置错误 | 报错 |

## 路由

- task_type: `kickoff_meeting`
- state: **reviewing**
- **强制云端**（multi_agent_cloud.md）：4-6 Agent 并发

## 关联

- 子系统：`kickoff_meeting.md` / `multi_agent_cloud.md` / `voice_print.md` / `facts-extraction.md`
- 决策：P10（启动器）/ P14（多 Agent 云端）/ F2-F4（语义边界）
- 触发时机：diff_check 🔴 命中核心术语时也触发

## 测试用例

1. **首次立项**：空白书 → 7 类冲突全部报
2. **完美书**：所有维度已填 + 无冲突 → passed + 声纹派生
3. **增量立项**：mode=increment + since=commit → 仅审查变更字段
4. **必须修复**：单项 🟠 → must_fix 退出
5. **硬否决**：🔴 命中 → hard_block 退出
