# character_card.yaml — character_card 命令 API

## 命令 ID

`character_card`

## 命令描述

**展示角色卡 + 声纹**——按 web spec `character-profile-XXX.html` 输出。

MVP 简化为：**展示**已填的角色档案 + 声纹（`voice_prints/*.md`）。

## 入参

```yaml
book_name:
  type: str
  required: true
character_id:
  type: str
  required: true
  description: 角色 ID（与 02-characters.md 中一致）
output_format:
  type: enum
  enum: [json, yaml, markdown]
  default: json
```

## 出参

```yaml
character:
  name: str
  role: enum [protagonist, ally, rival, neutral, mentor, ...]
  age: int
  gender: enum
  background: str
  personality: str
  motivation: str
voice_features:
  say_list: array of str
  forbidden_list: array of str
  mbti_reference: enum [ISTJ, ENTP, ...]  # 16personalities 类型
arc:
  current_stage: str
  chapter_start: int
  stages: array
```

**完整 schema 见 `contracts/character-profile.yaml`**（待 Phase 1 创建）。

## 退出码

| code | 含义 |
|------|------|
| 0 | 成功展示 |
| 1 | 角色 ID 不存在 |
| 2 | 声纹未生成（提示跑 kickoff_meeting） |

## 路由

- task_type: `character_card`
- state: **reviewing**
- 本地优先 + Ollama 即可（声纹已在设定库）

## 关联

- 子系统：`voice_print.md` §数据模型
- 决策：P8 / 008-v2
- Web spec：`character-profile-XXX.html`

## 测试用例

1. **主角卡展示**：character_id=protagonist → 完整档案 + 声纹
2. **声纹缺失**：character_id=lyc + 声纹未生成 → 提示跑 kickoff_meeting
3. **盟友展示**：character_id=ally1 → 简化版
