# plan_chapter.yaml — plan_chapter 命令 API

## 命令 ID

`plan_chapter`

## 命令描述

**章节规划命令** —— 基于设定 + 时间线 + 声纹，规划下一章内容。

按 `MVP_AUTHORITY §五`：plan_chapter 依赖"立项会输出 + 伏笔提醒系统"。

## 入参

```yaml
book_name:
  type: str
  required: true
chapter_n:
  type: int
  required: true
include_voice_considerations:
  type: bool
  default: true
  description: 是否包含声纹层面考虑
```

## 出参

```yaml
chapter_plan:
  chapter: int
  title: str  # 章节标题（如有）
  goal: str  # 本章目标（推进 / 转折 / 高潮 / 收束）
  characters:
    type: array
    items:
      character_id: str
      role: enum [protagonist, ally, rival, neutral, cameo]
      purpose: str
  foreshadows:
    type: array
    items: str  # 本章可能埋 / 收的伏笔
  voice_considerations:  # 声纹建议
    type: array
    items:
      character_id: str
      must_use: array of str  # 建议使用的口头禅
      avoid: array of str    # 必须避开的禁说
  estimated_words: int
estimated_decision: enum [pass, ambiguous, conflict]
```

## 退出码

| code | 含义 |
|------|------|
| 0 | 规划生成 |
| 1 | 时间线不连续 |
| 2 | 声纹未生成（提示跑 kickoff_meeting） |
| 3 | 配置错误 |

## 路由

- task_type: `plan_chapter`
- state: **reviewing**
- 本地 Ollama 优先，token 不超过 4-8k

## 关联

- 子系统：`foreshadow_half_loop.md`（伏笔提醒）/ `voice_print.md`（声纹建议）
- 决策：F8（伏笔排程提醒）
- Web spec：`plan.html`

## 测试用例

1. **简单规划**：第 30 章有 5 个 core 角色 → 输出 5 个角色安排
2. **声纹空缺**：voice_prints 缺主角 → 退出 2 提示
3. **伏笔覆盖**：foreshadow_half_loop 给出本章候选伏笔
