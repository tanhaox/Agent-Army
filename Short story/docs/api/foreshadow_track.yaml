# foreshadow_track.yaml — foreshadow_track 命令 API

## 命令 ID

`foreshadow_track`

## 命令描述

**伏笔半自动闭环**——按 `foreshadow_half_loop.md` 实现 4 个动作：

- list: 列出所有伏笔
- candidates: 列出本章应回收的伏笔
- propose: AI 提议新伏笔（reviewing + 多 Agent 云端）
- accept / reject / resolve: 作者手动维护

## 入参

```yaml
book_name:
  type: str
  required: true
action:
  type: enum
  enum: [list, candidates, propose, accept, reject, resolve]
  default: list
chapter_n:
  type: int
  required: false
  description: action=candidates/resolve 时必填
foreshadow_id:
  type: str
  required: false
  description: action=accept/reject/resolve 时必填
reason:
  type: str
  required: false
  description: action=reject 时必填
```

## 出参

```yaml
foreshadows:  # list / candidates 动作
  type: array
  items:
    id: str
    title: str
    type: enum [人-出场, 人-退场, 事-好事, 事-坏事, 物-获得, 物-损失]
    level: enum [L1-推动, L2-转折]
    state: enum [已埋, 待收, 已收]
    chapter_buried: int
    chapter_due: int
    chapter_resolved: int | null
    summary: str
candidates:  # candidates 专属
  type: array
  items:  # + urgency 字段
    urgency: enum [🔴_overdue, 🟡_approaching, 🟢_planned]
proposed:  # propose 专属
  type: array
  items:
    title: str
    type: str
    level: enum [L1-推动, L2-转折]
    reason: str
    suggested_chapter_due: int
result:  # accept / reject / resolve 专属
  success: bool
  updated_state: enum [已埋, 待收, 已收]
  error_msg: str
```

## 退出码

| code | 含义 |
|------|------|
| 0 | 成功 |
| 1 | 输入参数不足 |
| 2 | 伏笔 ID 不存在 |
| 3 | 配置错误 |

## 路由

| action | state | 路由 |
|--------|-------|------|
| list / candidates | reviewing | **本地**（纯文件计算） |
| propose | reviewing | **云端多 Agent**（foreshadow_proposer persona） |
| accept / reject / resolve | reviewing | **本地**（仅写文件） |
| resolve | writing | **本地**（即时） |

## 触发场景

- F4 自动：每章末扫 → 自动调 candidates（write.html 保存）
- 手动：作者随时 list / accept / reject
- 多 Agent：kickoff_meeting / 打磨时会自动 propose
- git_diff_trigger：核心术语变更 → 不直接调，但会触发新一轮 kickoff

## 关联

- 子系统：`foreshadow_half_loop.md`（领域总览）/ `false_positive_loop.md`（误报反馈）
- 决策：F3（半自动闭环）/ F4（每章末）/ F8（作者定回收章）
- Web spec：`foreshadow.html`

## 测试用例

1. **list**: 输出全部伏笔 + 状态
2. **candidates (chapter 50)**: chapter_due=50 的伏笔 → 🟡 approaching
3. **propose**: 多 Agent 输出 3-5 条建议 → 不写入
4. **accept**: ai_proposal → state=已埋
5. **reject**: 写入 false_positive_loop 日志
6. **resolve**: chapter_resolved=N
