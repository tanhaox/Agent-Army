# setup_consult.yaml — setup_consult 命令 API

## 命令 ID

`setup_consult`

## 命令描述

**设定填写引导命令**——按 6 维度模板引导作者填写或审改核心设定。

按 `voice_print.md §生成时机` 的"**作者 + AI 共创**"原则，AI 提问 + 作者手填核心 6 维度（人物/关系/世界观/框架/看点/伏笔）。

## 入参（args）

```yaml
book_name:
  type: str
  required: true
  description: 书名（目录名）
dimension:
  type: enum
  enum: [01-world, 02-characters, 03-framework, 04-tone, 05-foreshadow, 06-audience, all]
  default: all
  description: 要引导填写的设定维度
mode:
  type: enum
  enum: [fill, review]
  default: fill
  description: fill=引导填写；review=审改已有
```

## 出参（output）

```yaml
status:
  type: enum
  enum: [success, partial, error]
required_fields_missing:
  type: array
  items: str
  description: 还缺的必填字段（用于重新引导）
ai_suggestions:
  type: array
  description: AI 对各字段的建议
  items:
    field: str
    suggestion: str
```

**示例**：

```json
{
  "status": "partial",
  "required_fields_missing": ["02-characters.md 主角动机", "03-framework.md 故事分段"],
  "ai_suggestions": [
    {"field": "02-characters.md 主角动机", "suggestion": "建议补充主角的执念与短中长期目标"}
  ]
}
```

## 退出码

| code | 含义 | 后续动作 |
|------|------|---------|
| 0 | 全部必填项已填 | 进入 kickoff_meeting |
| 1 | 部分必填项未填 | 提示作者补全 |
| 2 | 配置错误 | 报错，retry |

## 任务类型 + 状态

- task_type: `setup_consult`
- state: **reviewing**（默认）

## 路由

- **本地 Ollama** 优先
- **降级云端**：超过 8k token 时

## 关联

- 子系统：`content_attribution.md`（设定采纳时 frontmatter 处理）
- 决策：F1（AI 提问 + 作者手填）/ P9（几万字入场券）
- 启动顺序：MVP_AUTHORITY.md §四 Phase 1.D

## 测试用例

1. **空书引导**：6 维度全缺 → 输出 required_fields_missing 全 6 项
2. **半填引导**：填了 4 维度 → 输出剩余 2 维度
3. **审改模式**：mode=review + 既有设定 → AI 给出建议

