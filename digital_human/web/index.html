<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>数字人口播流水线</title>
  <link rel="stylesheet" href="/web/index.css">
</head>
<body>
  <nav>
    <div class="logo">Pipeline<span>Studio</span></div>
    <a href="/web/index.html" class="active">流水线</a>
    <a href="/web/director.html">导演控制台</a>
    <a href="/web/library.html">视频库</a>
    <a href="/web/templates.html">模板管理</a>
    <a href="/web/visual_render.html">视觉渲染</a>
    <a href="/web/voices.html">音色管理</a>
    <a href="/web/roles.html">角色管理</a>
    <a href="/web/personas.html">人物</a>
    <div class="spacer"></div>
    <a href="/docs" target="_blank">API Docs</a>
  </nav>

  <div class="container">
    <!-- Pipeline Header -->
    <div class="pipeline-header">
      <h1>数字人口播流水线</h1>
      <p>文章 → 洗稿 → 音频 → 导演控制台 → 视频</p>
    </div>

    <!-- Step Indicator -->
    <div class="steps" id="step-indicator">
      <div class="step-dot active" data-step="1" onclick="scrollToStep(1)"><div class="num">1</div>输入文章</div>
      <div class="step-line"></div>
      <div class="step-dot" data-step="2" onclick="scrollToStep(2)"><div class="num">2</div>AI 洗稿</div>
      <div class="step-line"></div>
      <div class="step-dot" data-step="3" onclick="scrollToStep(3)"><div class="num">3</div>生成音频</div>
    </div>

    <!-- Step 1: Input Article -->
    <div class="card" id="step-1-card">
      <h3><span class="icon">📝</span> 输入原始文章</h3>
      <div class="form-row">
        <div>
          <label>标题（可选）</label>
          <input type="text" id="article-title" placeholder="输入文章标题">
        </div>
        <div>
          <label>来源 URL（可选）</label>
          <input type="text" id="article-url" placeholder="https://...">
        </div>
      </div>
      <div class="btn-group" style="margin-bottom:1rem;">
        <button class="btn btn-secondary btn-sm" type="button" id="btn-fetch-url" onclick="fetchUrl()">🌐 抓取 URL</button>
      </div>
      <label>正文内容</label>
      <textarea id="article-text" placeholder="粘贴财经新闻原文..." style="min-height:160px;"></textarea>
      <div class="btn-group" style="margin-top:1rem;">
        <button class="btn btn-primary" id="btn-create" onclick="createArticle()">创建稿件</button>
      </div>
      <div class="status" id="status-create"></div>
    </div>

    <!-- Step 2: AI Rewrite -->
    <div class="card" id="step-2-card">
      <h3><span class="icon">🤖</span> AI 洗稿</h3>
      <div class="form-row" style="margin-bottom:1rem;">
        <div style="flex:0 0 200px;">
          <label>数字人（人物）</label>
          <select id="rewrite-host" style="width:100%;padding:0.4rem 0.6rem;font-size:0.82rem;">
            <option value="">加载中…</option>
          </select>
        </div>
        <div style="flex:0 0 220px;">
          <label>数字人 / 提示词模板</label>
          <select id="rewrite-template" style="width:100%;padding:0.4rem 0.6rem;font-size:0.82rem;">
            <option value="">加载中…</option>
          </select>
        </div>
        <div style="flex:0 0 140px;">
          <label>LLM 模型</label>
          <select id="rewrite-model" style="width:100%;padding:0.4rem 0.6rem;font-size:0.82rem;">
            <option value="flash">Flash（快）</option>
            <option value="pro">Pro（强）</option>
          </select>
        </div>
        <div style="flex:0 0 140px;">
          <label>视频画幅</label>
          <select id="rewrite-format" style="width:100%;padding:0.4rem 0.6rem;font-size:0.82rem;">
            <option value="portrait" selected>竖屏 9:16</option>
            <option value="landscape">横屏 16:9</option>
            <option value="square">方形 1:1</option>
          </select>
        </div>
        <div style="display:flex;align-items:flex-end;">
          <button class="btn btn-secondary btn-sm" id="btn-load" onclick="loadLatest()">加载最新稿件</button>
        </div>
      </div>
      <div style="margin-bottom:1rem;">
        <label style="font-size:0.85rem;">💡 补充观点（选填）</label>
        <textarea id="perspective-1" placeholder="输入你想强调或补充的观点，将注入到洗稿提示词中…" style="min-height:50px;" maxlength="500"></textarea>
        <div style="font-size:0.72rem;color:var(--text-muted);text-align:right;"><span id="perspective-1-count">0</span>/500</div>
      </div>
      <div class="btn-group" style="margin-bottom:1rem;">
        <button class="btn btn-primary" id="btn-rewrite" onclick="rewriteArticle()" disabled>开始洗稿</button>
      </div>
      <div class="status" id="status-rewrite"></div>
      <label style="margin-top:1rem;">洗稿结果（可直接编辑）</label>
      <textarea id="script-text" placeholder="洗稿结果将显示在这里..." style="min-height:160px;"></textarea>
      <div id="perspective-2-section" style="display:none;margin-top:1rem;padding:0.75rem;border:1px solid var(--border);border-radius:var(--radius-sm);">
        <label>✏️ 修正观点（选填，对洗稿结果不满意时提交微调）</label>
        <textarea id="perspective-2" placeholder="描述你希望调整的方向…" style="min-height:60px;" maxlength="500"></textarea>
        <div style="display:flex;justify-content:space-between;align-items:center;margin-top:0.5rem;">
          <span style="font-size:0.72rem;color:var(--text-muted);"><span id="perspective-2-count">0</span>/500</span>
          <button class="btn btn-primary btn-sm" id="btn-correct" onclick="correctScript()">提交修正</button>
        </div>
        <div class="status" id="status-correct"></div>
      </div>
      <div class="btn-group" style="margin-top:1rem;">
        <button class="btn btn-success btn-sm" id="btn-save-script" onclick="saveScript()" disabled>保存编辑</button>
      </div>
    </div>

    <!-- Step 3: Generate Audio (with segment selection) -->
    <div class="card" id="step-3-card">
      <h3><span class="icon">🎙️</span> 生成音频</h3>

      <!-- Segment selection (needed for TTS) -->
      <div style="margin-bottom:1.25rem;">
        <label style="margin-bottom:0.5rem;">选择口播段落（勾选后生成音频）</label>
        <div class="btn-group" style="margin-bottom:0.5rem;">
          <button class="btn btn-secondary btn-sm" type="button" onclick="selectAll(true)">全选</button>
          <button class="btn btn-secondary btn-sm" type="button" onclick="selectAll(false)">取消全选</button>
          <span id="director-count" style="font-size:0.78rem;color:var(--text-muted);margin-left:auto;"></span>
        </div>
        <div id="segments-list"></div>
      </div>

      <div style="border-top:1px solid var(--border);padding-top:1.25rem;">
        <div class="form-row">
          <div>
            <label>音色选择</label>
            <select id="voice-select"></select>
          </div>
        </div>

        <!-- 启用的管线 (2026-08-07 从 director.html 迁入): 生成音频前定死管线配置,
             避免生成完跳导演台时三开关全开导致规划在三开状态下进行 -->
        <div class="pipeline-toggles" style="display:flex;gap:1.5rem;align-items:center;margin:0.75rem 0 0 0;padding:0.6rem 0.8rem;background:var(--bg-secondary);border-radius:8px;">
          <span style="font-size:0.8rem;font-weight:600;color:var(--text-muted);">启用的管线:</span>
          <label class="toggle-switch" title="C线 — ComfyUI (host/mixed_broll)">
            <input type="checkbox" id="toggle-c" onchange="onPipelineToggle()">
            <span class="toggle-slider"></span>
            <span class="toggle-label">C线 <small>ComfyUI</small></span>
          </label>
          <label class="toggle-switch" title="P线 — Pexels (broll_pexels)">
            <input type="checkbox" id="toggle-p" checked onchange="onPipelineToggle()">
            <span class="toggle-slider"></span>
            <span class="toggle-label">P线 <small>Pexels</small></span>
          </label>
          <label class="toggle-switch" title="H线 — HuggingFace (hf_chart / hf_title)">
            <input type="checkbox" id="toggle-h" checked onchange="onPipelineToggle()">
            <span class="toggle-slider"></span>
            <span class="toggle-label">H线 <small>HF</small></span>
          </label>
        </div>
        <div id="persona-lock" style="display:none;margin-top:0.5rem;padding:0.5rem 0.75rem;border-radius:var(--radius-sm);background:rgba(139,92,246,0.1);border:1px solid rgba(139,92,246,0.3);font-size:0.82rem;color:#c4b5fd;">
        </div>
        <div class="btn-group" style="margin-top:0.5rem;">
          <button class="btn btn-primary" id="btn-audio" onclick="generateAudio()" disabled>生成音频</button>
          <button class="btn btn-violet" id="btn-onestop" onclick="oneStop()" disabled title="生成音频 → 创建并规划 → 执行 Slots → 合成视频，每步完成后自动触发下一步">🚀 一键成片</button>
        </div>
      </div>
      <div class="status" id="status-audio"></div>
      <div class="audio-list" id="audio-list"></div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <script src="/web/app.js?v=6"></script>
  <script src="/web/index.js"></script>
</body>
</html>
