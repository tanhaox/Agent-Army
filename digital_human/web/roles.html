<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>角色管理 — 数字人口播流水线</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; background: #0f172a; color: #e2e8f0; }
    header { padding: 1rem 2rem; background: #1e293b; border-bottom: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; }
    header h1 { margin: 0; font-size: 1.25rem; }
    header nav a { font-size: 0.85rem; color: #94a3b8; text-decoration: none; margin-left: 0.75rem; }
    .container { max-width: 1200px; margin: 0 auto; padding: 1.5rem; }
    .toolbar { display: flex; gap: 0.75rem; margin-bottom: 1.5rem; align-items: center; }
    .toolbar .badge { font-size: 0.8rem; padding: 0.25rem 0.6rem; border-radius: 0.4rem; background: #334155; color: #94a3b8; }
    .toolbar .badge.online { background: #064e3b; color: #6ee7b7; }
    .toolbar .badge.offline { background: #450a0a; color: #fca5a5; }
    button { padding: 0.6rem 1.2rem; border: none; border-radius: 0.4rem; background: #2563eb; color: white; cursor: pointer; font-size: 0.95rem; }
    button:disabled { background: #475569; cursor: not-allowed; }
    button.secondary { background: #475569; }
    button.danger { background: #b91c1c; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1rem; }
    .card { background: #1e293b; border: 1px solid #334155; border-radius: 0.75rem; padding: 1rem; }
    .card .ref-img { width: 100%; aspect-ratio: 1 / 1; object-fit: cover; border-radius: 0.5rem; background: #0f172a; display: block; }
    .card .name { margin: 0.75rem 0 0.25rem; font-size: 1.05rem; font-weight: 600; }
    .card .meta { font-size: 0.8rem; color: #94a3b8; }
    .card .views { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0.25rem; margin: 0.75rem 0; }
    .card .views img { width: 100%; aspect-ratio: 1 / 1; object-fit: cover; border-radius: 0.3rem; background: #0f172a; }
    .card .views .empty { width: 100%; aspect-ratio: 1 / 1; background: #0f172a; border-radius: 0.3rem; display: flex; align-items: center; justify-content: center; color: #64748b; font-size: 0.7rem; }
    .card .actions { display: flex; gap: 0.5rem; margin-top: 0.75rem; flex-wrap: wrap; }
    .card .actions button { flex: 1; min-width: 80px; padding: 0.4rem 0.6rem; font-size: 0.85rem; }
    .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: none; align-items: center; justify-content: center; z-index: 100; }
    .modal-bg.active { display: flex; }
    .modal { background: #1e293b; border: 1px solid #334155; border-radius: 0.75rem; padding: 1.5rem; width: min(560px, 95vw); max-height: 90vh; overflow-y: auto; }
    .modal h2 { margin-top: 0; font-size: 1.1rem; }
    .modal label { display: block; margin: 0.75rem 0 0.25rem; font-size: 0.85rem; color: #cbd5e1; }
    .modal input[type="text"], .modal textarea, .modal input[type="number"], .modal input[type="file"] { width: 100%; padding: 0.6rem; border-radius: 0.4rem; border: 1px solid #475569; background: #0f172a; color: #e2e8f0; font-size: 0.9rem; }
    .modal textarea { min-height: 100px; resize: vertical; }
    .modal .row-btns { display: flex; gap: 0.5rem; margin-top: 1rem; justify-content: flex-end; }
    .status { margin-top: 0.5rem; padding: 0.6rem; border-radius: 0.4rem; background: #0f172a; font-size: 0.85rem; min-height: 1.5rem; }
    .status.error { background: #450a0a; color: #fca5a5; }
    .status.success { background: #064e3b; color: #6ee7b7; }
    .progress-bar { width: 100%; height: 8px; background: #0f172a; border-radius: 4px; overflow: hidden; margin: 0.5rem 0; }
    .progress-bar > div { height: 100%; background: #38bdf8; width: 0%; transition: width 0.3s; }
    pre.json { background: #0f172a; padding: 0.75rem; border-radius: 0.4rem; font-size: 0.78rem; overflow-x: auto; max-height: 320px; overflow-y: auto; }
    .empty-state { padding: 2rem; text-align: center; color: #64748b; }
  </style>
</head>
<body>
  <header>
    <h1>🎭 角色管理 <span id="comfyui-badge" class="badge">检测 ComfyUI...</span></h1>
    <nav>
      <a href="/web/index.html">📝 主流水线</a>
      <a href="/web/voices.html">🎙️ 音色管理</a>
    </nav>
  </header>

  <div class="container">
    <div class="toolbar">
      <button onclick="openCreateModal()">+ 添加角色</button>
      <button class="secondary" onclick="loadRoles()">🔄 刷新</button>
      <span style="font-size: 0.85rem; color: #94a3b8;">角色一致性 / 多视图定型 (ComfyUI)</span>
    </div>

    <div id="grid" class="grid"></div>
  </div>

  <!-- 创建角色 Modal -->
  <div id="create-modal" class="modal-bg">
    <div class="modal">
      <h2>新建角色</h2>
      <label>角色名 *</label>
      <input type="text" id="f-name" placeholder="例: 赛博小助手-001" maxlength="128">
      <label>角色描述 (prompt 注入)</label>
      <textarea id="f-description" maxlength="1000" placeholder="例: 赛博朋克 2.5D 少女, 30 岁, 短发, 黑红夹克..."></textarea>
      <label>参考图 * (PNG/JPG, ≤10MB)</label>
      <input type="file" id="f-reference" accept="image/*">
      <label>Workflow</label>
      <select id="f-workflow" style="width:100%;padding:0.6rem;border-radius:0.4rem;border:1px solid #475569;background:#0f172a;color:#e2e8f0;">
        <option value="character_three_view">character_three_view (多视图定型)</option>
      </select>
      <label>Seed (可选, 留空=随机)</label>
      <input type="number" id="f-seed" min="0" placeholder="留空=随机">
      <div class="row-btns">
        <button class="secondary" onclick="closeCreateModal()">取消</button>
        <button onclick="submitCreate()">创建</button>
      </div>
      <div class="status" id="create-status"></div>
    </div>
  </div>

  <!-- 编辑 Modal -->
  <div id="edit-modal" class="modal-bg">
    <div class="modal">
      <h2>编辑角色</h2>
      <input type="hidden" id="edit-id">
      <label>角色名</label>
      <input type="text" id="edit-name" maxlength="128">
      <label>角色描述</label>
      <textarea id="edit-description" maxlength="1000"></textarea>
      <label>Seed</label>
      <input type="number" id="edit-seed" min="0">
      <div class="row-btns">
        <button class="secondary" onclick="closeEditModal()">取消</button>
        <button onclick="submitEdit()">保存</button>
      </div>
      <div class="status" id="edit-status"></div>
    </div>
  </div>

  <!-- 生成视图 Modal -->
  <div id="generate-modal" class="modal-bg">
    <div class="modal">
      <h2>生成多视图</h2>
      <input type="hidden" id="gen-id">
      <p style="font-size:0.85rem;color:#94a3b8;" id="gen-meta"></p>
      <label>Seed (留空使用角色已存 seed)</label>
      <input type="number" id="gen-seed" min="0" placeholder="留空=沿用角色 seed">
      <label>描述覆盖 (留空使用角色描述)</label>
      <textarea id="gen-description" maxlength="1000" placeholder="留空=使用角色描述"></textarea>
      <div class="progress-bar" id="gen-progress" style="display:none;"><div></div></div>
      <div class="status" id="gen-status"></div>
      <div class="row-btns">
        <button class="secondary" onclick="closeGenerateModal()">取消</button>
        <button id="btn-gen-start" onclick="startGenerate()">开始生成</button>
      </div>
    </div>
  </div>

  <!-- Apply Modal -->
  <div id="apply-modal" class="modal-bg">
    <div class="modal">
      <h2>主流水线入参 (ID-007 留接口位)</h2>
      <pre class="json" id="apply-json"></pre>
      <div class="row-btns">
        <button class="secondary" onclick="closeApplyModal()">关闭</button>
      </div>
    </div>
  </div>

  <script>
    const ROLE_VIEWS = ["front", "side", "full"];

    async function checkComfyUI() {
      const badge = document.getElementById("comfyui-badge");
      try {
        const r = await fetch("/api/comfyui/health");
        const d = await r.json();
        badge.textContent = d.online ? "ComfyUI 在线" : "ComfyUI 离线";
        badge.className = "badge " + (d.online ? "online" : "offline");
      } catch (e) {
        badge.textContent = "ComfyUI 离线";
        badge.className = "badge offline";
      }
    }

    async function loadRoles() {
      const grid = document.getElementById("grid");
      try {
        const r = await fetch("/api/roles");
        if (!r.ok) { grid.innerHTML = `<div class="empty-state">加载失败: HTTP ${r.status}</div>`; return; }
        const roles = await r.json();
        if (!roles.length) { grid.innerHTML = `<div class="empty-state">尚无角色,点击 "+ 添加角色" 开始</div>`; return; }
        grid.innerHTML = roles.map(r => renderCard(r)).join("");
      } catch (e) {
        grid.innerHTML = `<div class="empty-state">加载异常: ${e}</div>`;
      }
    }

    function renderCard(r) {
      const refFile = r.reference_image.split(/[\\/]/).pop();
      const viewImgs = ROLE_VIEWS.map(v => {
        const p = r.views && r.views[v];
        return p
          ? `<img src="file:///${p.replace(/\\/g, "/")}" title="${v}" onerror="this.style.opacity=0.2">`
          : `<div class="empty">${v}</div>`;
      }).join("");
      const viewCount = r.views ? Object.keys(r.views).length : 0;
      const seedTxt = r.seed != null ? `seed=${r.seed}` : "seed=随机";
      return `
        <div class="card">
          <img class="ref-img" src="file:///${r.reference_image.replace(/\\/g, "/")}" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect fill=%22%230f172a%22 width=%22100%22 height=%22100%22/><text x=%2250%22 y=%2250%22 fill=%22%2364748b%22 text-anchor=%22middle%22 font-size=%2210%22>ref</text></svg>'">
          <div class="name">${escapeHtml(r.name)}</div>
          <div class="meta">${escapeHtml(refFile)} · ${seedTxt} · ${viewCount}/3 视图</div>
          <div class="views">${viewImgs}</div>
          <div class="actions">
            <button onclick="openGenerateModal('${r.id}')" title="调 ComfyUI 出 3 张视图">🎨 生成视图</button>
            <button class="secondary" onclick="openEditModal('${r.id}')">✏️ 编辑</button>
            <button class="secondary" onclick="applyRole('${r.id}')" ${viewCount < 3 ? "disabled" : ""} title="${viewCount < 3 ? "请先生成视图" : "应用到主流水线"}">📌 应用</button>
            <button class="danger" onclick="deleteRole('${r.id}')">🗑</button>
          </div>
        </div>
      `;
    }

    function escapeHtml(s) {
      return String(s || "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
    }

    // ----- Create Modal -----
    function openCreateModal() {
      document.getElementById("create-modal").classList.add("active");
      document.getElementById("f-name").value = "";
      document.getElementById("f-description").value = "";
      document.getElementById("f-reference").value = "";
      document.getElementById("f-seed").value = "";
      document.getElementById("create-status").textContent = "";
    }
    function closeCreateModal() { document.getElementById("create-modal").classList.remove("active"); }

    async function submitCreate() {
      const status = document.getElementById("create-status");
      const name = document.getElementById("f-name").value.trim();
      const description = document.getElementById("f-description").value.trim();
      const workflow = document.getElementById("f-workflow").value;
      const seed = document.getElementById("f-seed").value || "";
      const file = document.getElementById("f-reference").files[0];
      if (!name) { status.textContent = "请填角色名"; status.className = "status error"; return; }
      if (!file) { status.textContent = "请选参考图"; status.className = "status error"; return; }
      const fd = new FormData();
      fd.append("name", name);
      fd.append("description", description);
      fd.append("workflow_used", workflow);
      if (seed) fd.append("seed", seed);
      fd.append("reference", file);
      status.textContent = "上传中...";
      status.className = "status";
      try {
        const r = await fetch("/api/roles", { method: "POST", body: fd });
        if (!r.ok) { const t = await r.text(); status.textContent = `失败: HTTP ${r.status} ${t}`; status.className = "status error"; return; }
        status.textContent = "✓ 创建成功"; status.className = "status success";
        setTimeout(() => { closeCreateModal(); loadRoles(); }, 600);
      } catch (e) {
        status.textContent = "异常: " + e;
        status.className = "status error";
      }
    }

    // ----- Edit Modal -----
    async function openEditModal(id) {
      const r = await fetch(`/api/roles/${id}`);
      if (!r.ok) { alert("加载失败"); return; }
      const role = await r.json();
      document.getElementById("edit-id").value = role.id;
      document.getElementById("edit-name").value = role.name;
      document.getElementById("edit-description").value = role.description || "";
      document.getElementById("edit-seed").value = role.seed || "";
      document.getElementById("edit-status").textContent = "";
      document.getElementById("edit-modal").classList.add("active");
    }
    function closeEditModal() { document.getElementById("edit-modal").classList.remove("active"); }

    async function submitEdit() {
      const status = document.getElementById("edit-status");
      const id = document.getElementById("edit-id").value;
      const data = {
        name: document.getElementById("edit-name").value.trim(),
        description: document.getElementById("edit-description").value.trim(),
        seed: document.getElementById("edit-seed").value ? Number(document.getElementById("edit-seed").value) : null,
      };
      try {
        const r = await fetch(`/api/roles/${id}`, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(data),
        });
        if (!r.ok) { status.textContent = `失败: HTTP ${r.status}`; status.className = "status error"; return; }
        status.textContent = "✓ 已保存"; status.className = "status success";
        setTimeout(() => { closeEditModal(); loadRoles(); }, 500);
      } catch (e) {
        status.textContent = "异常: " + e;
        status.className = "status error";
      }
    }

    // ----- Generate Modal -----
    async function openGenerateModal(id) {
      const r = await fetch(`/api/roles/${id}`);
      if (!r.ok) { alert("加载失败"); return; }
      const role = await r.json();
      document.getElementById("gen-id").value = role.id;
      document.getElementById("gen-meta").textContent = `角色: ${role.name} · workflow: ${role.workflow_used} · 当前 seed: ${role.seed ?? "(未锁定)"}`;
      document.getElementById("gen-seed").value = "";
      document.getElementById("gen-description").value = "";
      document.getElementById("gen-progress").style.display = "none";
      document.getElementById("gen-status").textContent = "";
      document.getElementById("gen-status").className = "status";
      document.getElementById("btn-gen-start").disabled = false;
      document.getElementById("generate-modal").classList.add("active");
    }
    function closeGenerateModal() { document.getElementById("generate-modal").classList.remove("active"); }

    async function startGenerate() {
      const id = document.getElementById("gen-id").value;
      const seed = document.getElementById("gen-seed").value;
      const description = document.getElementById("gen-description").value.trim();
      const status = document.getElementById("gen-status");
      const progress = document.getElementById("gen-progress");
      const btn = document.getElementById("btn-gen-start");

      const body = {};
      if (seed) body.seed = Number(seed);
      if (description) body.description_override = description;

      status.textContent = "⏳ ComfyUI 生成中 (可能 1-5 分钟)...";
      status.className = "status";
      progress.style.display = "block";
      progress.querySelector("div").style.width = "10%";
      btn.disabled = true;

      let timer = setInterval(() => {
        const w = parseInt(progress.querySelector("div").style.width || "10", 10);
        if (w < 90) progress.querySelector("div").style.width = (w + 5) + "%";
      }, 3000);

      try {
        const r = await fetch(`/api/roles/${id}/generate-views`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });
        clearInterval(timer);
        progress.querySelector("div").style.width = "100%";
        if (!r.ok) {
          const t = await r.text();
          status.textContent = `✗ HTTP ${r.status}: ${t}`;
          status.className = "status error";
          btn.disabled = false;
          return;
        }
        const data = await r.json();
        const viewCount = Object.keys(data.views || {}).length;
        status.textContent = `✓ 完成: ${viewCount}/3 视图 (prompt_id=${data.prompt_id || "n/a"})`;
        status.className = "status success";
        setTimeout(() => { closeGenerateModal(); loadRoles(); }, 1200);
      } catch (e) {
        clearInterval(timer);
        status.textContent = "异常: " + e;
        status.className = "status error";
        btn.disabled = false;
      }
    }

    // ----- Apply Modal -----
    async function applyRole(id) {
      const r = await fetch(`/api/roles/${id}/apply`, { method: "POST" });
      if (!r.ok) { alert(`应用失败: HTTP ${r.status}`); return; }
      const data = await r.json();
      document.getElementById("apply-json").textContent = JSON.stringify(data, null, 2);
      document.getElementById("apply-modal").classList.add("active");
    }
    function closeApplyModal() { document.getElementById("apply-modal").classList.remove("active"); }

    // ----- Delete -----
    async function deleteRole(id) {
      if (!confirm("确认删除角色？(磁盘文件保留)")) return;
      const r = await fetch(`/api/roles/${id}`, { method: "DELETE" });
      if (!r.ok) { alert(`删除失败: HTTP ${r.status}`); return; }
      loadRoles();
    }

    // ----- Init -----
    checkComfyUI();
    loadRoles();
  </script>
</body>
</html>
