# Agent Army - 数据库配置
# Phase 0: 基础设施配置

# ============================================
# PostgreSQL - 业务数据存储
# ============================================
postgresql:
  # 本地开发环境
  local:
    host: localhost
    port: 5432
    database: agent_army
    user: postgres
    password: ${POSTGRESQL_PASSWORD}  # 从环境变量读取
    pool_size: 5
    max_overflow: 10
    pool_timeout: 30

  # 生产环境(阿里云)
  production:
    host: 112.126.61.223
    port: 5432
    database: agent_army
    user: postgres
    password: ${POSTGRESQL_PASSWORD}
    pool_size: 3  # 阿里云内存限制,使用较小的连接池
    max_overflow: 5
    pool_timeout: 30

# ============================================
# Redis - 缓存 + 配额管理
# ============================================
redis:
  # 本地开发环境
  local:
    host: localhost
    port: 6379
    db: 0  # 使用DB 0存储业务数据
    password: ${REDIS_PASSWORD}
    max_connections: 10

  # 生产环境(阿里云)
  production:
    host: 112.126.61.223
    port: 6379
    db: 0
    password: ${REDIS_PASSWORD}
    max_connections: 5  # 阿里云内存限制

  # 配额管理专用
  quota:
    db: 1  # 使用DB 1存储API配额
    key_prefix: "quota:"
    ttl: 18000  # 5小时(智谱配额周期)

# ============================================
# SQLite - 知识图谱(轻量级方案)
# ============================================
sqlite:
  # 本地开发环境
  local:
    db_path: ./data/knowledge_graph.db
    check_same_thread: False
    timeout: 10

  # 生产环境(阿里云)
  production:
    db_path: /var/www/agent-army/data/knowledge_graph.db
    check_same_thread: False
    timeout: 10

  # 知识图谱配置
  knowledge_graph:
    # 实体类型
    entity_types:
      - stock  # 股票
      - industry  # 行业
      - concept  # 概念
      - event  # 事件
      - indicator  # 指标

    # 关系类型
    relation_types:
      - belongs_to  # 属于
      - relates_to  # 相关
      - influences  # 影响
      - tracks  # 追踪
      - predicts  # 预测

# ============================================
# 数据迁移配置
# ============================================
migration:
  auto_migrate: True  # 自动执行迁移
  version_table: schema_version  # 版本记录表
  backup_before_migrate: True  # 迁移前备份
